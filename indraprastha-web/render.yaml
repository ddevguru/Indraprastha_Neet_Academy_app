# ==============================================================================
# Render Blueprint for Indraprastha NEET Academy Website
# Root Directory: indraprastha-web
# Frontend: Next.js Web App (./)
# Backend: Express Auth & Student API (backend)
# Database: External GCP Cloud SQL / PostgreSQL (No separate Render DB created)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. WEBSITE BACKEND SERVICE (Express Node.js API)
  # ----------------------------------------------------------------------------
  - type: web
    name: indraprastha-web-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ─── EXTERNAL GCP POSTGRESQL DATABASE ───
      # Connects directly to existing GCP Cloud SQL database (indraprastha_db)
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "indraprastha_db"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ─── AUTHENTICATION & SECURITY ───
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: DEMO_OTP_ENABLED
        value: "false"

      # ─── FIREBASE ADMIN AUTH (Google & Phone OTP) ───
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # ----------------------------------------------------------------------------
  # 2. WEBSITE FRONTEND SERVICE (Next.js Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: indraprastha-web
    runtime: node
    rootDir: ./
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # ─── API BASE URL (Points to the Website Backend Service on Render) ───
      - key: NEXT_PUBLIC_API_BASE
        value: https://indraprastha-web-backend.onrender.com/api/auth

      # ─── FIREBASE CLIENT CONFIGURATION ───
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyBha4ZEKcaQlUwhbUBNyzrTBC1VRIZIHW4
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: indraprastha-web.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: indraprastha-web
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: indraprastha-web.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "536433711964"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:536433711964:web:9eba07648f8e7707b37f99
